<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>个人名片 | 林知夏</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!-- 页面主区域：使用语义化 main 包裹名片内容 -->
	<main class="page-wrapper">
		<!-- 个人名片卡片 -->
		<article class="profile-card">
			<!-- 圆形头像区域 -->
			<div class="avatar-wrapper">
				<img class="avatar" src="https://i.pravatar.cc/240?img=47" alt="林知夏的头像">
			</div>

			<!-- 姓名与职业信息 -->
			<div class="profile-intro">
				<p class="eyebrow">PERSONAL PROFILE</p>
				<h1>林知夏</h1>
				<p class="job-title">品牌视觉设计师</p>
				<p class="bio">专注于用简洁而有温度的设计，连接品牌与人的日常。</p>
			</div>

			<!-- 联系方式列表 -->
			<address class="contact-list">
				<a class="contact-item" href="mailto:hello@linzhixia.com">
					<span class="contact-icon" aria-hidden="true">@</span>
					<span>hello@linzhixia.com</span>
				</a>
				<a class="contact-item" href="tel:+8613800138000">
					<span class="contact-icon" aria-hidden="true">T</span>
					<span>+86 138 0013 8000</span>
				</a>
				<a class="contact-item" href="https://www.linzhixia.com" target="_blank" rel="noopener noreferrer">
					<span class="contact-icon" aria-hidden="true">↗</span>
					<span>www.linzhixia.com</span>
				</a>
			</address>
		</article>
	</main>
</body>
</html>
